version: 2.1

# Definimos los jobs (tareas)
jobs:
  build:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:6.0
    steps:
      - checkout
      - run:
          name: Restaurar dependencias
          command: |
            dotnet restore
      - run:
          name: Construir aplicación
          command: |
            dotnet build --configuration Release --no-restore
      - persist_to_workspace:
          root: .
          paths:
            - .

  test:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:6.0
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Ejecutar pruebas
          command: |
            dotnet test --configuration Release --no-build

# Definimos el workflow (flujo de trabajo)
workflows:
  version: 2
  build-and-test:
    jobs:
      - build
      - test:
          requires:
            - build
