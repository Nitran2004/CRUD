version: 2.1

# Definimos los jobs (tareas)
jobs:
  build:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:6.0
    steps:
      - checkout
      - run:
          name: Restaurar dependencias
          command: |
            dotnet restore
      - run:
          name: Construir aplicación
          command: |
            dotnet build --configuration Release --no-restore
      - persist_to_workspace:
          root: .
          paths:
            - .
      # Notificaciones explícitas por email
      - run:
          name: Notificar éxito de build por email
          command: |
            if [ -n "$CIRCLE_BRANCH" ]; then
              echo "Build exitoso en la rama $CIRCLE_BRANCH" | mail -s "CircleCI: Build exitoso" "$CIRCLE_USERNAME@users.noreply.github.com"
            fi
          when: on_success
      - run:
          name: Notificar fallo de build por email
          command: |
            if [ -n "$CIRCLE_BRANCH" ]; then
              echo "Build fallido en la rama $CIRCLE_BRANCH. Ver detalles en: ${CIRCLE_BUILD_URL}" | mail -s "CircleCI: Build fallido" "$CIRCLE_USERNAME@users.noreply.github.com"
            fi
          when: on_fail

  test:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:6.0
    # Configuramos paralelismo - ejecuta este job en 4 instancias paralelas
    parallelism: 4
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Instalar herramientas de email
          command: |
            apt-get update
            apt-get install -y mailutils
      - run:
          name: Ejecutar pruebas en paralelo
          command: |
            # Obtiene todos los proyectos de prueba
            PROJECTS=$(find . -name "*Tests.csproj" -o -name "*Test.csproj")
            
            # Divide los proyectos entre las instancias paralelas
            echo $PROJECTS | tr ' ' '\n' | circleci tests split --split-by=timings > /tmp/tests-to-run
            
            # Ejecuta las pruebas asignadas a esta instancia
            while read -r project; do
              echo "Ejecutando pruebas en: $project"
              dotnet test "$project" --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
            done < /tmp/tests-to-run
      
      # Almacenar resultados de pruebas
      - store_test_results:
          path: TestResults
          
      # Notificaciones explícitas por email
      - run:
          name: Notificar éxito de pruebas por email
          command: |
            if [ -n "$CIRCLE_BRANCH" ]; then
              echo "Pruebas exitosas en la rama $CIRCLE_BRANCH" | mail -s "CircleCI: Pruebas exitosas" "$CIRCLE_USERNAME@users.noreply.github.com"
            fi
          when: on_success
      - run:
          name: Notificar fallo de pruebas por email
          command: |
            if [ -n "$CIRCLE_BRANCH" ]; then
              echo "Pruebas fallidas en la rama $CIRCLE_BRANCH. Ver detalles en: ${CIRCLE_BUILD_URL}" | mail -s "CircleCI: Pruebas fallidas" "$CIRCLE_USERNAME@users.noreply.github.com"
            fi
          when: on_fail

  deploy:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:6.0
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Instalar herramientas de email
          command: |
            apt-get update
            apt-get install -y mailutils
      - run:
          name: Publicar aplicación
          command: |
            dotnet publish --configuration Release --no-build --output ./publish
      # Notificaciones explícitas por email
      - run:
          name: Notificar éxito de despliegue por email
          command: |
            if [ -n "$CIRCLE_BRANCH" ]; then
              echo "Despliegue exitoso en la rama $CIRCLE_BRANCH" | mail -s "CircleCI: Despliegue exitoso" "$CIRCLE_USERNAME@users.noreply.github.com"
            fi
          when: on_success
      - run:
          name: Notificar fallo de despliegue por email
          command: |
            if [ -n "$CIRCLE_BRANCH" ]; then
              echo "Despliegue fallido en la rama $CIRCLE_BRANCH. Ver detalles en: ${CIRCLE_BUILD_URL}" | mail -s "CircleCI: Despliegue fallido" "$CIRCLE_USERNAME@users.noreply.github.com"
            fi
          when: on_fail

# Definimos el workflow (flujo de trabajo)
workflows:
  version: 2
  build-test-deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: main
