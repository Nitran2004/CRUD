version: 2.1

# Definimos los jobs (tareas)
jobs:
  build:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:6.0
    steps:
      - checkout
      - run:
          name: Restaurar dependencias
          command: |
            dotnet restore
      - run:
          name: Construir aplicación
          command: |
            dotnet build --configuration Release --no-restore
      - persist_to_workspace:
          root: .
          paths:
            - .
      # Notificación simple mediante commandos integrados
      - run:
          name: Notificar resultado de build
          command: |
            echo "Build completado con éxito"
          when: on_success
      - run:
          name: Notificar fallo de build
          command: |
            echo "Build falló"
          when: on_fail

  test:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:6.0
    # Configuramos paralelismo - ejecuta este job en 4 instancias paralelas
    parallelism: 4
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Ejecutar pruebas en paralelo
          command: |
            # Obtiene todos los proyectos de prueba
            PROJECTS=$(find . -name "*Tests.csproj" -o -name "*Test.csproj")
            
            # Divide los proyectos entre las instancias paralelas
            echo $PROJECTS | tr ' ' '\n' | circleci tests split --split-by=timings > /tmp/tests-to-run
            
            # Ejecuta las pruebas asignadas a esta instancia
            while read -r project; do
              echo "Ejecutando pruebas en: $project"
              dotnet test "$project" --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
            done < /tmp/tests-to-run
      
      # Almacenar resultados de pruebas
      - store_test_results:
          path: TestResults
          
      # Notificación simple mediante comandos integrados
      - run:
          name: Notificar resultado de pruebas
          command: |
            echo "Pruebas completadas con éxito"
          when: on_success
      - run:
          name: Notificar fallo de pruebas
          command: |
            echo "Las pruebas fallaron"
          when: on_fail

  deploy:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:6.0
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Publicar aplicación
          command: |
            dotnet publish --configuration Release --no-build --output ./publish
      # Notificación simple mediante comandos integrados
      - run:
          name: Notificar resultado de despliegue
          command: |
            echo "Despliegue completado con éxito"
          when: on_success
      - run:
          name: Notificar fallo de despliegue
          command: |
            echo "El despliegue falló"
          when: on_fail

# Definimos el workflow (flujo de trabajo)
workflows:
  version: 2
  build-test-deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: main

# Configuración de notificaciones por email (integradas en CircleCI)
notify:
  webhooks:
    # Una lista de webhooks a los que enviar notificaciones cuando se produce un cambio en el estado del build
    - url: https://example.com/hooks/circleci
